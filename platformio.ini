; =====================================================================
; CONFIGURAÇÕES GLOBAIS (Compartilhadas por todas as placas)
; =====================================================================
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/DHT sensor library @ ^1.4.6

; =====================================================================
; AMBIENTE: ESP32 Clássico(s3)
; =====================================================================
[env:esp32_dev]
platform = espressif32
board = esp32dev
build_flags = 
    -D ARQUITETURA_ESP32
    -D BOARD_ESP32_DEV
    -D SDK_VERSION="1.0.0"
    -D PINO_DHT=15
    -D PINO_PORTA=33
build_src_filter = +<*> -<drivers/nrf52/> -<drivers/milkv/>

; =====================================================================
; AMBIENTE: nRF52840 Nordic
; =====================================================================
[env:nrf52840_dk]
platform = nordicnrf52
board = nrf52840_dk
build_flags = 
    -D ARQUITETURA_NRF52
    -D BOARD_NRF52840_DK
    -D USE_LOW_POWER
    -D SDK_VERSION="1.0.0"
    -D PINO_DHT=4
    -D PINO_PORTA=13
build_src_filter = +<*> -<drivers/esp32/> -<drivers/milkv/>

; =====================================================================
; AMBIENTE: Milk-V Duo (RISC-V de Alta Performance)
; =====================================================================
; [env:milkv_duos]
; platform = riscv
; board = milkv_duos
; build_flags = 
;     -D ARQUITETURA_MILKV
;     -D BOARD_MILKV_DUOS
