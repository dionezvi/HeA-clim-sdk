;     -D PINO_DHT=2
;     -D PINO_PORTA=3
; build_src_filter = +<*> -<drivers/esp32/> -<drivers/nrf52/>
; NOTE: `milkv_duo` requires a custom RISC-V platform/package not currently installed.

; =====================================================================
; AMBIENTE: ESP32-C3 (RISC-V de Baixo Custo)
; =====================================================================
[env:esp32c3_riscv]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = 
    -D ARQUITETURA_ESP32C3
    -D BOARD_ESP32C3_RISCV
    -D SDK_VERSION="1.0.0"
    -D PINO_DHT=4
    -D PINO_PORTA=5
build_src_filter = +<*> -<drivers/nrf52/> -<drivers/milkv/>
